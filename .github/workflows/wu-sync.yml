name: WU Sync (intraday + daily)

on:
  schedule:
    # ogni 15 minuti
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run sync
        env:
          WU_STATION_ID: ICOLLI48
          WU_API_KEY: 1ab6a961853d4b73b6a961853dcb73ff
          WU_TZ: Europe/Rome
        run: node scripts/wu-sync.js

      - name: Commit changes (if any)
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "wu-sync-bot"
            git config user.email "wu-sync-bot@users.noreply.github.com"
            git add data/daily.json public/data/intraday/*.json
            git commit -m "WU sync: update intraday & daily"
            git push
          else
            echo "No changes to commit."
          fi