name: Aggiorna dati Weather Underground

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: update-wunderground-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa le dipendenze
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Recupera i dati Weather Underground
        env:
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
          WU_STATION_ID: ICOLLI48
          WU_START_DATE: "2026-07-10"
        shell: bash
        run: |
          set -e

          MAX_ATTEMPTS=3
          ATTEMPT=1

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "Tentativo $ATTEMPT di $MAX_ATTEMPTS..."

            if node scripts/update-wunderground.mjs; then
              echo "Recupero dati completato correttamente."
              exit 0
            fi

            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "Recupero dati fallito dopo $MAX_ATTEMPTS tentativi."
              exit 1
            fi

            echo "Tentativo fallito. Nuovo tentativo tra 30 secondi..."
            sleep 30
            ATTEMPT=$((ATTEMPT + 1))
          done

      - name: Rigenera daily.json e i file intraday
        shell: bash
        run: |
          set -e
          node scripts/build-data.js

      - name: Rigenera i record
        shell: bash
        run: |
          set -e
          node scripts/build-records.js

      - name: Salva i dati aggiornati su GitHub
        shell: bash
        run: |
          set -e

          if [ -z "$(git status --porcelain -- data_raw/clean/auto data/daily.json data/record.json public/data/intraday)" ]; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi

          LAST_AUTHOR_NAME="$(git log -1 --pretty=format:'%an')"
          LAST_AUTHOR_EMAIL="$(git log -1 --pretty=format:'%ae')"

          git config user.name "$LAST_AUTHOR_NAME"
          git config user.email "$LAST_AUTHOR_EMAIL"

          git add data_raw/clean/auto
          git add data/daily.json
          git add data/record.json
          git add public/data/intraday

          git commit -m "Aggiornamento automatico dati meteo e record"
          git pull --rebase origin main
          git push origin HEAD:main