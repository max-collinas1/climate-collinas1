name: Aggiorna allerte Protezione Civile

on:
  schedule:
    - cron: "7,27,47 * * * *"

permissions:
  contents: write

concurrency:
  group: protezione-civile-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Riallinea con origin/main
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Verifica se eseguire il controllo
        id: gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          run = True
          path = Path("public/data/protezione-civile.json")

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
              checked_at = data.get("checkedAt")
              if checked_at:
                  dt = datetime.fromisoformat(checked_at.replace("Z", "+00:00"))
                  age = (datetime.now(timezone.utc) - dt).total_seconds()
                  run = age >= 3300
          except Exception:
              run = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"run={'true' if run else 'false'}\n")
          PY

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa Poppler
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Aggiorna Protezione Civile
        if: steps.gate.outputs.run == 'true'
        run: node scripts/update-protezione-civile.mjs

      - name: Controlla modifiche
        if: steps.gate.outputs.run == 'true'
        id: changes
        shell: bash
        run: |
          if git diff --quiet --             public/data/protezione-civile.json             public/data/protezione-civile-oggi.jpg             public/data/protezione-civile-domani.jpg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit
        if: steps.gate.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             public/data/protezione-civile.json             public/data/protezione-civile-oggi.jpg             public/data/protezione-civile-domani.jpg
          git commit -m "Aggiorna Protezione Civile"

      - name: Push con retry
        if: steps.gate.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Tentativo push $attempt/5"
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            sleep 12
          done

          echo "Push non riuscito dopo 5 tentativi"
          exit 1