async function fetchResponse(url, accept = HEADERS.accept, attempts = 3) {
  let lastError = null;
  for (let attempt = 1; attempt <= attempts; attempt += 1) {
    try {
      const response = await fetch(url, {
        headers: {
          ...HEADERS,
          accept,
          "cache-control": "no-cache",
          pragma: "no-cache",
        },
        redirect: "follow",
        cache: "no-store",
      });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status} - ${url}`);
      }
      return response;
    } catch (error) {
      lastError = error;
      if (attempt < attempts) {
        await new Promise((resolve) => setTimeout(resolve, 1200 * attempt));
      }
    }
  }
