    const pattern = new RegExp(`\\b${attribute}\\s*=\\s*["']([^"']+)["']`, "i");
    const match = tag.match(pattern);
    if (!match?.[1]) continue;
    const url = absoluteUrl(baseUrl, decodeHtml(match[1]));
    if (url) return url;
  }
  const srcsetMatch = tag.match(/\bsrcset\s*=\s*["']([^"']+)["']/i);
  if (srcsetMatch?.[1]) {
    const first = decodeHtml(srcsetMatch[1]).split(",")[0]?.trim().split(/\s+/)[0];
