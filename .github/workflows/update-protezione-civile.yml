              remoteUrl: null,
              date: keyToItalianDate(nextKey),
              pending: true,
              rolledFromPreviousBulletin: false,
              note: "In attesa della mappa di domani dal nuovo bollettino della Protezione Civile.",
            },
      sourceState: "current",
