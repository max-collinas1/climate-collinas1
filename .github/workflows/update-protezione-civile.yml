name: Aggiorna allerte Protezione Civile

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: protezione-civile-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Riallinea con origin/main
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa Poppler
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Aggiorna Protezione Civile
        run: node scripts/update-protezione-civile.mjs

      - name: Controlla modifiche
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- \
            public/data/protezione-civile.json \
            public/data/protezione-civile-oggi.jpg \
            public/data/protezione-civile-domani.jpg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/data/protezione-civile.json \
            public/data/protezione-civile-oggi.jpg \
            public/data/protezione-civile-domani.jpg
          git commit -m "Aggiorna Protezione Civile"

      - name: Push con retry
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Tentativo push $attempt/5"
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            sleep 12
          done

          echo "Push non riuscito dopo 5 tentativi"
          exit 1